# 子模型特征分配
submodel_features:
  xgboost: "all"
  lightgbm: ["momentum", "market", "position"]
  catboost: ["price_volume", "market", "position"]

# 交叉验证
cross_validation:
  type: "time_series_by_sample"
  n_splits: 3
  train_days: 300
  val_days: 30
  test_days: 30

# 子模型超参数
submodels:
  xgboost:
    objective: "binary:logistic"
    eval_metric: ["auc", "aucpr"]
    max_depth: 6
    learning_rate: 0.1
    subsample: 0.9
    colsample_bytree: 0.8
    min_child_weight: 5
    gamma: 0.1
    reg_alpha: 0.1
    reg_lambda: 1.0
    scale_pos_weight: 1.5
    tree_method: "hist"
    max_bin: 255
    grow_policy: "lossguide"
    max_delta_step: 1
    num_boost_round: 500
    early_stopping_rounds: 50
  lightgbm:
    objective: "binary"
    metric: ["auc", "binary_logloss"]
    boosting_type: "gbdt"
    max_depth: 6
    num_leaves: 31
    learning_rate: 0.1
    feature_fraction: 0.3
    bagging_fraction: 0.7
    bagging_freq: 1
    min_child_samples: 20
    min_child_weight: 0.001
    reg_alpha: 0.1
    reg_lambda: 1.0
    verbose: -1
    scale_pos_weight: 1.5
    num_boost_round: 500
    early_stopping_rounds: 50
  catboost:
    iterations: 500
    learning_rate: 0.1
    depth: 6
    l2_leaf_reg: 3.0
    border_count: 254
    early_stopping_rounds: 50
    loss_function: "Logloss"
    eval_metric: "AUC"
    scale_pos_weight: 1.5
    rsm: 0.8

# 校准 (v297 已禁用)
calibration:
  method: "none"

# 集成策略
aggregation:
  method: "auc_weighted"
  # diversity_aware 参数 (v297 未使用，但保留)
  diversity_aware:
    alpha: 2.0
    beta: 0.5

# 训练后验证 Gates
validation:
  gates:
    submodel_correlation:
      enabled: true
      min_correlation: 0.40
      block_on_fail: false
    probability_distribution:
      enabled: true
      mean_min: 0.05
      mean_max: 0.50
      block_on_fail: false
    top50_disagreement:
      enabled: true
      max_disagreement: 0.65
      block_on_fail: false
    brier_score:
      enabled: true
      max_brier: 0.18
      block_on_fail: true

# 输出
output:
  model_family: "breakout_launch_scorer"
  model_version: "v2.9.5-ensemble"
  save_submodel_features: true
  update_current_json: true
  current_json_stage: "development"

# 关键注释
notes:
  - "v297 回归高AUC + 适度分歧路线"
  - "温度缩放已禁用 (对齐v2.7.0)"
  - "简单AUC加权投票 (去掉diversity惩罚)"
  - "分歧度 gate 改为警告而非强制终止"
  - "动态类别权重计算但使用固定值 1.5"
  - "时间衰减权重已禁用 (对齐v2.7.0)"
  - "P0优化: 全部子模型使用全部特征，通过colsample强制diversity"
