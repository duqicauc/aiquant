# v2.9.7 集成模型训练脚本配置提取
# 来源: scripts/train_v297_ensemble.py (886行)
# 提取日期: 2026-05-09
# 用途: 作为配置驱动重构的基线参考

meta:
  version: "v2.9.7-ensemble"
  description: "v2.9.7 集成模型 - 动态类别权重 + 适度分歧 + 放宽Gates"
  source_script: "train_v297_ensemble.py"

# 全局随机种子与类别权重
random:
  seed: 42
  scale_pos_weight: 1.5

# 硬负样本比例上限
data:
  sample_dir: "data/training/v297"
  hard_neg_ratio_max: 0.18
  negative_downsample:
    enabled: true
    target_ratio: 2.22
    stratify_by: "total_mv"
    n_strata: 5
  market_neutralization:
    enabled: true
    columns: ["total_mv", "circ_mv"]
    n_bins: 5
  feature_cleaning:
    dead_features:
      - "breakout_confirmed_10d"
      - "breakout_confirmed_20d"
      - "breakout_resonance"
      - "market_regime"
      - "breakout_with_volume"
      - "resonance_volume_confirm"
      - "days_from_high_20d"
      - "days_from_high_55d"
      - "ma10_cross_count"
    redundant_features:
      - "obv_calc"
      - "ma5"
      - "bbi"
      - "ktn_mid"
      - "boll_mid"
      - "resistance_55d"
      - "support_55d"
      - "resistance_10d"
      - "resistance_20d"
      - "price_vs_hist_mean"
      - "return_8d"
      - "return_34d"
      - "return_55d"
      - "breakout_strength_10d"
      - "breakout_strength_20d"
      - "max_drawdown_55d"
      - "vol_ma20_ratio"
      - "breakout_strength_max"
      - "price_vs_hist_high"

