# ============================================================================
# 3L 评分系统配置 (Three-Light Scoring System)
# ============================================================================
# 本配置定义短期/中期/长期三灯评分系统的参数。
# 短期和长期评分由独立 LightGBM 模型输出，中期为已有集成模型。
#
# 变更此文件后，无需修改代码即可调整评分行为。
# 变更需记录变更日志（满足 AGENTS.md 原则 #30）。
# ============================================================================

# --- 模型路径配置 ---
models:
  short_term:
    name: "short_term_scorer"
    version: "v1.0.0"
    model_dir: "data/models/short_term_scorer/versions/v1.0.0/model"
    # 特征列表文件，训练时自动生成
    feature_names_file: "feature_names.json"
    # 模型文件
    model_file: "lightgbm.txt"
    # 校准器文件（Platt scaling）
    calibrator_file: "calibrator.pkl"

  long_term:
    name: "long_term_scorer"
    version: "v1.0.0"
    model_dir: "data/models/long_term_scorer/versions/v1.0.0/model"
    feature_names_file: "feature_names.json"
    model_file: "lightgbm.txt"
    calibrator_file: "calibrator.pkl"

# --- 中期模型概率校准 ---
# 中期模型 (v294 ensemble) 原始概率分布极度右偏（中位数≈0，大量样本prob≈0）。
# 为使三灯概率在数学上等价，对中期 prob 做后处理幂变换校准。
mid_term_calibration:
  enabled: true
  # 幂变换指数 alpha: p_cal = p^alpha
  # alpha < 1 拉伸低概率区域，alpha > 1 压缩低概率区域
  # 推荐值: 0.30-0.40（根据短期/长期分布匹配度调整）
  alpha: 0.35
  # 校准后最小值保护（防止 prob=0 导致共振评分完全缺失中期贡献）
  min_prob: 0.03
  # 校准后最大值限制
  max_prob: 0.99

# --- 回退机制 ---
# 当模型文件不存在或监控触发回退时，使用规则打分作为后备
fallback:
  enabled: true
  # 自动回退条件：模型 AUC 连续 N 天低于阈值
  auto_fallback: true
  # 触发回退的 AUC 阈值
  auc_threshold: 0.55
  # 连续低于阈值的天数
  consecutive_days: 14

# --- 共振评分配置 ---
resonance:
  enabled: true
  # 三灯权重（和应为 1.0）
  weights:
    short: 0.30
    mid:   0.40
    long:  0.20
  # 阶段加成权重
  stage_bonus_weight: 0.10
  # 阶段加成规则
  stage_bonus:
    # 三灯全绿 + 拉升初期
    all_green_early_rally: 0.15
    # 三灯全绿 + 拉升中期
    all_green_mid_rally:   0.10
    # 两绿一黄 + 拉升初期
    two_green_early_rally: 0.05
    # 任何一红
    any_red: 0.0

# --- 3L 过滤器阈值 ---
# L1/L2/L3 的判定阈值（模型输出概率）
filters:
  l1_momentum:
    # prob_short 最低阈值
    min_prob: 0.50
    # 允许的 market_stage
    allowed_stages:
      - "拉升初期"
      - "拉升中期"
  l2_quality:
    min_prob: 0.50
    # 排除的 market_stage
    excluded_stages:
      - "下跌"
      - "顶部"
  l3_timing:
    # 左侧信号至少满足 N 个条件
    min_left_signals: 2
    # 或 market_stage 为以下之一
    allowed_stages:
      - "筑底"
      - "拉升初期"

# --- 击球区（Strike Zone）阈值 ---
strike_zone:
  # 中期概率阈值
  min_prob_mid: 0.70
  # 短期概率阈值
  min_prob_short: 0.60
  # 要求 market_stage 包含
  stage_contains: "拉升"
  # 替代方案：使用共振评分
  use_resonance: true
  min_resonance: 0.75
  # 共振模式下要求至少 N 个绿灯
  min_green_lights: 2

# --- 前端颜色阈值 ---
ui:
  prob_color:
    green:  0.70   # >= 0.70 显示绿色
    yellow: 0.50   # >= 0.50 显示黄色
    # < 0.50 显示灰色

# --- 训练配置 ---
training:
  short_term:
    # 预测周期（交易日）
    lookforward_days: 5
    # 正样本阈值：未来 N 日收盘价涨幅 >= 5%
    return_threshold: 0.05
    # 正样本回撤约束：未来 N 日最大回撤 >= -3%
    max_drawdown_threshold: -0.03
    # LightGBM 参数
    lgb_params:
      objective: binary
      metric: binary_logloss
      boosting_type: gbdt
      num_leaves: 31
      learning_rate: 0.05
      feature_fraction: 0.8
      bagging_fraction: 0.8
      bagging_freq: 5
      verbose: -1
      n_estimators: 200
      early_stopping_rounds: 20
    # 训练数据范围
    min_training_days: 252  # 至少 1 年数据
    # 时间序列交叉验证折数
    n_splits: 5

  long_term:
    lookforward_days: 120
    # 正样本阈值：未来 N 日超额收益 >= 大盘 + 10%
    excess_return_threshold: 0.10
    lgb_params:
      objective: binary
      metric: binary_logloss
      boosting_type: gbdt
      num_leaves: 31
      learning_rate: 0.05
      feature_fraction: 0.8
      bagging_fraction: 0.8
      bagging_freq: 5
      verbose: -1
      n_estimators: 200
      early_stopping_rounds: 20
    min_training_days: 500  # 至少 2 年数据
    n_splits: 5

# --- 监控配置 ---
monitoring:
  # 监控历史窗口（天）
  history_window: 30
  # 每日检查指标
  daily_check:
    # 短期模型最低 AUC
    short_min_auc: 0.55
    # 长期模型最低 AUC
    long_min_auc: 0.55
    # 模型漂移检测：预测分布 KL 散度阈值
    kl_divergence_threshold: 0.10
