version: "3.8"

services:
  aiquant-api:
    build: .
    container_name: aiquant-api
    command: >
      bash -c "python3 -m uvicorn src.api.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./.env:/app/.env
    environment:
      - PYTHONPATH=/app
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  aiquant-dashboard:
    build: .
    container_name: aiquant-dashboard
    command: >
      bash -c "python3 src/dashboard/app.py"
    ports:
      - "8050:8050"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./.env:/app/.env
    environment:
      - PYTHONPATH=/app
    restart: unless-stopped
    depends_on:
      - aiquant-api
