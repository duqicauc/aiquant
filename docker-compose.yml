version: '3.8'

services:
  aiquant:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aiquant
    ports:
      - "80:80"
    volumes:
      # 数据持久化（SQLite、缓存、预测结果、回测结果）
      - ./data:/app/data
      # 日志持久化
      - ./logs:/app/logs
      # 环境变量（外部挂载，方便修改不重建镜像）
      - ./.env:/app/.env:ro
    environment:
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
      - TZ=Asia/Shanghai
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
